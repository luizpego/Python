{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plataforma de cursos de tecnologia">
    <title>{% block title %}DevClass{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="page-glow page-glow-one" aria-hidden="true"></div>
    <div class="page-glow page-glow-two" aria-hidden="true"></div>

    <header class="site-header">
        <nav class="navbar container" aria-label="Navegação principal">
            <a class="brand" href="/" aria-label="DevClass - página inicial">
                <span class="brand-mark">&lt;/&gt;</span>
                <span>DevClass</span>
            </a>
            <div class="nav-links">
                <a href="/">Início</a>
                <a href="/cursos/">Cursos</a>
                {% if user.is_authenticated %}
                    <a class="nav-button" href="/painel/">Meu painel</a>
                {% else %}
                    <a class="nav-button" href="/login/">Entrar</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
        <div class="container footer-content">
            <a class="brand brand-footer" href="/"><span class="brand-mark">&lt;/&gt;</span><span>DevClass</span></a>
            <p>Aprenda tecnologia de forma prática e construa o seu futuro.</p>
        </div>
    </footer>
</body>
</html>
